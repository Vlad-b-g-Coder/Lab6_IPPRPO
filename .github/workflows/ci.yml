name: CI

# Триггеры: push в main и любой Pull Request в main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Официальный базовый Docker-образ Python
    container:
      image: python:3.12-slim

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: 1. Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 2. Сборка (компиляция и проверка синтаксиса)
        run: python -m compileall -q gateway_core.py test_gateway_core.py

      - name: 3. Тестирование
        run: pytest -v --cov --cov-report=term-missing
